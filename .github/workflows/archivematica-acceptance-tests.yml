name: "Archivematica Acceptance Tests"
on:
  workflow_dispatch:
    inputs:
      am_version:
        description: "Archivematica ref (branch, tag or SHA to checkout)"
        default: "qa/1.x"
        required: true
        type: "string"
      ss_version:
        description: "Archivematica Storage Service ref (branch, tag or SHA to checkout)"
        default: "qa/0.x"
        required: true
        type: "string"
      at_version:
        description: "Archivematica Acceptance Test ref (branch, tag or SHA to checkout)"
        default: "qa/1.x"
        required: true
        type: "string"
      os:
        description: "Operating system to test"
        default: "all"
        required: true
        type: "choice"
        options:
          - "all"
          - "rocky9"
          - "rocky8"
          - "noble"
          - "jammy"
      feature:
        description: "AMAUAT feature file to run"
        default: "all"
        required: true
        type: "choice"
        options:
          - "all"
          - "aip-encryption-mirror"
          - "aip-encryption"
          - "checksum"
          - "create-aip"
          - "description-rights"
          - "extract-package"
          - "ingest-mkv-conformance"
          - "ingest-policy-check"
          - "metadata-xml"
          - "reingest-aip"
          - "transfer-microservices"
          - "transfer-mkv-conformance"
          - "transfer-policy-check"
          - "uuids-for-directories"
          - "validation"
          - "virus"
  schedule:
    - cron: "0 3 * * *"
jobs:
  select_matrix:
    name: "Select AMAUAT matrix"
    runs-on: "ubuntu-24.04"
    outputs:
      features: "${{ steps.select.outputs.features }}"
      docker_images: "${{ steps.select.outputs.docker_images }}"
    steps:
      - name: "Select matrix"
        id: "select"
        env:
          SELECTED_FEATURE: "${{ inputs.feature }}"
          SELECTED_OS: "${{ inputs.os }}"
        run: |
          all_features=(
              "aip-encryption-mirror"
              "aip-encryption"
              "checksum"
              "create-aip"
              "description-rights"
              "extract-package"
              "ingest-mkv-conformance"
              "ingest-policy-check"
              "metadata-xml"
              "reingest-aip"
              "transfer-microservices"
              "transfer-mkv-conformance"
              "transfer-policy-check"
              "uuids-for-directories"
              "validation"
              "virus"
          )
          selected_feature=${SELECTED_FEATURE:-all}

          if [[ $selected_feature == "all" ]]; then
              features=("${all_features[@]}")
          else
              feature_is_valid=false
              for feature in "${all_features[@]}"; do
                  if [[ $selected_feature == "$feature" ]]; then
                      feature_is_valid=true
                      break
                  fi
              done
              if [[ $feature_is_valid != "true" ]]; then
                  echo "Unknown AMAUAT feature: ${selected_feature}" >&2
                  exit 1
              fi
              features=("$selected_feature")
          fi

          features_json=$(
              jq --compact-output --null-input \
                  '$ARGS.positional' --args "${features[@]}"
          )
          echo "features=${features_json}" >> "$GITHUB_OUTPUT"

          selected_os=${SELECTED_OS:-all}
          docker_images=$(
              jq --compact-output --null-input \
                  --arg selected_os "$selected_os" \
                  '[
                      {
                          name: "rockylinux",
                          tag: "9",
                          label: "rocky9"
                      },
                      {
                          name: "rockylinux",
                          tag: "8",
                          label: "rocky8"
                      },
                      {
                          name: "ubuntu",
                          tag: "24.04",
                          label: "noble"
                      },
                      {
                          name: "ubuntu",
                          tag: "22.04",
                          label: "jammy"
                      }
                  ]
                  | if $selected_os == "all"
                    then .
                    else map(select(.label == $selected_os))
                    end'
          )
          if [[ $(jq 'length' <<< "$docker_images") -eq 0 ]]; then
              echo "Unknown operating system: ${selected_os}" >&2
              exit 1
          fi
          echo "docker_images=${docker_images}" >> "$GITHUB_OUTPUT"
  test:
    name: "${{ matrix.feature }} / ${{ matrix.docker_image.label }}"
    needs:
      - "select_matrix"
    runs-on: "ubuntu-24.04"
    env:
      am_version: "${{ inputs.am_version || 'qa/1.x' }}"
      ss_version: "${{ inputs.ss_version || 'qa/0.x' }}"
      at_version: "${{ inputs.at_version || 'qa/1.x' }}"
      python_version: "3.10"
    strategy:
      fail-fast: false
      matrix:
        docker_image: "${{ fromJSON(needs.select_matrix.outputs.docker_images) }}"
        feature: "${{ fromJSON(needs.select_matrix.outputs.features) }}"
        browser:
          - "Firefox"
    steps:
      - name: "Check out code"
        uses: "actions/checkout@v4"
      - name: "Check out AMAUATs code"
        uses: "actions/checkout@v4"
        with:
          repository: "artefactual-labs/archivematica-acceptance-tests"
          ref: "${{ env.at_version }}"
          path: "${{ github.workspace }}/AMAUATs"
      - name: "Set up uv"
        uses: "astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990" # v8.3.2
        with:
          working-directory: "${{ github.workspace }}/AMAUATs"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
      - name: "Set up the Podman test"
        uses: "./.github/actions/setup-podman-test"
        with:
          test-directory: "tests/archivematica-acceptance-tests"
          python-version: "${{ env.python_version }}"
          cache-key-suffix: "image-${{ matrix.docker_image.label }}"
          constraints-file: "${{ matrix.docker_image.label == 'rocky8' && 'tests/common/constraints-rocky8.txt' || '' }}"
        env:
          DOCKER_IMAGE_NAME: "${{ matrix.docker_image.name }}"
          DOCKER_IMAGE_TAG: "${{ matrix.docker_image.tag }}"
      - name: "Install Ansible requirements"
        working-directory: "${{ github.workspace }}/tests/archivematica-acceptance-tests"
        run: |
          ../common/prepare-ansible-roles requirements.yml
      - name: "Install Archivematica"
        working-directory: "${{ github.workspace }}/tests/archivematica-acceptance-tests"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_PORT: 2222
        run: |
          ansible-playbook -i localhost, playbook.yml \
              -u ubuntu \
              -e "archivematica_src_am_version=${{ env.am_version }} archivematica_src_ss_version=${{ env.ss_version }}" \
              -v
      - name: "Disable machine learning in Elasticsearch"
        working-directory: "${{ github.workspace }}/tests/archivematica-acceptance-tests"
        run: |
          podman-compose exec --user root archivematica bash -c 'echo "xpack.ml.enabled: false" | tee -a /etc/elasticsearch/elasticsearch.yml'
          podman-compose exec --user root archivematica service elasticsearch restart
          podman-compose exec --user root archivematica service archivematica-dashboard restart
      - name: "Prepare the container for running the AMAUATs"
        working-directory: "${{ github.workspace }}/tests/archivematica-acceptance-tests"
        run: |
          podman-compose exec --user root archivematica usermod -a -G archivematica ubuntu
          podman-compose exec --user root archivematica ln -s /home/ubuntu /home/archivematica
      - name: "Check Archivematica APIs"
        run: |
          tests/common/check-archivematica-apis
      - name: "Set up AMAUATs"
        working-directory: "${{ github.workspace }}/AMAUATs"
        env:
          UV_PYTHON: "${{ env.python_version }}"
        run: |
          uv sync --locked --no-dev
      - name: "Run AMAUATs"
        id: "amauat-run"
        working-directory: "${{ github.workspace }}/AMAUATs"
        env:
          HEADLESS: 1
        run: |
          .venv/bin/behave -i ${{ matrix.feature }}.feature \
              -v \
              --no-capture \
              --no-capture-stderr \
              --no-logcapture \
              --no-skipped \
              -D am_version=1.9 \
              -D driver_name=${{ matrix.browser }} \
              -D am_username=admin \
              -D am_password=archivematica \
              -D am_url=http://localhost:8000/ \
              -D am_api_key="this_is_the_am_api_key" \
              -D ss_username=admin \
              -D ss_password=archivematica \
              -D ss_api_key="this_is_the_ss_api_key" \
              -D ss_url=http://localhost:8001/ \
              -D home=ubuntu \
              -D server_user=ubuntu \
              -D transfer_source_path=/home/ubuntu/archivematica-sampledata/TestTransfers/acceptance-tests \
              -D ssh_identity_file=$HOME/.ssh/id_rsa
      - name: "Save logs on failure"
        if: "${{ failure() || cancelled() }}"
        working-directory: "${{ github.workspace }}/tests/archivematica-acceptance-tests"
        run: |
          ../common/collect-test-logs logs archivematica
      - name: "Upload logs on failure"
        if: "${{ failure() || cancelled() }}"
        uses: "actions/upload-artifact@v4"
        with:
          name: "logs-${{ matrix.docker_image.label }}-${{ matrix.feature }}"
          path: "${{ github.workspace }}/tests/archivematica-acceptance-tests/logs"
