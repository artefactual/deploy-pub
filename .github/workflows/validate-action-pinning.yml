name: "Validate GitHub Action pinning"

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
  push:
    branches:
      - "master"
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"

permissions:
  contents: "read"

jobs:
  enforce-pinning:
    name: "Enforce commit SHA pinning"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Ensure SHA-pinned Actions"
        uses: "zgosalvez/github-actions-ensure-sha-pinned-actions@c4e71056006d29f90204b2d063be337109507d62" # v5.0.10
