# Boxes of the checklist that are expected to fail until a known problem is fixed.
#
# A listed box that fails is reported as "known" instead of failed, and the run
# does not fail on it; a listed box that passes is reported as a warning so the
# entry can be removed. `criterion` is the 1-based position of the box in the
# item; omit it to cover every box of the item. `platforms` are the RT_OS_LABEL
# values the entry applies to (a label matches when it contains the value);
# omit it to cover every platform. `releases` are the Archivematica versions
# the entry applies to, as prefixes of the version the pipeline reports
# ("1.19" matches 1.19.0 and 1.19.1 but not 1.190.0); omit it to cover every
# release.

