---

# The local root user authenticates through the Unix socket until the root
# client configuration exists, so these queries do not need a password.

- name: "Check whether root@localhost has the configured password"
  community.mysql.mysql_query:
    login_user: "root"
    login_unix_socket: "{{ mariadb_socket }}"
    query: >-
      SELECT 1 FROM mysql.user
      WHERE User = 'root' AND Host = 'localhost'
      AND plugin = 'mysql_native_password'
      AND authentication_string = PASSWORD(%(password)s)
    named_args:
      password: "{{ mariadb_root_password }}"
  register: mariadb_root_password_check
  changed_when: false
  no_log: true
  when: mariadb_root_password | length > 0

# The password lets other accounts and hosts authenticate while the
# unix_socket method keeps the passwordless access of the local root user,
# which the maintenance scripts of the packages rely on.
- name: "Set the root@localhost password"
  community.mysql.mysql_query:
    login_user: "root"
    login_unix_socket: "{{ mariadb_socket }}"
    query: >-
      ALTER USER 'root'@'localhost'
      IDENTIFIED VIA mysql_native_password USING PASSWORD(%(password)s)
      OR unix_socket
    named_args:
      password: "{{ mariadb_root_password }}"
  no_log: true
  when:
    - mariadb_root_password | length > 0
    - mariadb_root_password_check.rowcount[0] == 0

- name: "Write the root client configuration"
  ansible.builtin.template:
    src: "root-my.cnf.j2"
    dest: "/root/.my.cnf"
    owner: "root"
    group: "root"
    mode: "0600"
  no_log: true
