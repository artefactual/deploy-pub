repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "v6.0.0"
    hooks:
      - id: "check-yaml"
      - id: "end-of-file-fixer"
      - id: "trailing-whitespace"
        args:
          - "--markdown-linebreak-ext=md"
  - repo: "https://github.com/koalaman/shellcheck-precommit"
    rev: "v0.11.0"
    hooks:
      - id: "shellcheck"
        types_or:
          - "shell"
        args:
          - "--external-sources"
