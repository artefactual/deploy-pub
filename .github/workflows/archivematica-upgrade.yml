name: "Archivematica Upgrade Test"
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system to test"
        default: "all"
        required: true
        type: "choice"
        options:
          - "all"
          - "jammy"
          - "noble"
          - "rocky8"
          - "rocky9"
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/archivematica-upgrade.yml"
      - ".github/actions/setup-podman-test/**"
      - "playbooks/archivematica-noble/**"
      - "tests/archivematica-upgrade/**"
      - "tests/common/**"
      - "!tests/archivematica-upgrade/README.md"
      - "!tests/common/README.md"
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/archivematica-upgrade.yml"
      - ".github/actions/setup-podman-test/**"
      - "playbooks/archivematica-noble/**"
      - "tests/archivematica-upgrade/**"
      - "tests/common/**"
      - "!tests/archivematica-upgrade/README.md"
      - "!tests/common/README.md"
jobs:
  select_matrix:
    name: "Select Archivematica upgrade matrix"
    runs-on: "ubuntu-24.04"
    outputs:
      environments: "${{ steps.select.outputs.environments }}"
    steps:
      - name: "Select matrix"
        id: "select"
        env:
          SELECTED_OS: "${{ inputs.os }}"
        run: |
          selected_os=${SELECTED_OS:-all}
          environments=$(
              jq --compact-output --null-input \
                  --arg selected_os "$selected_os" \
                  '[
                      {
                          name: "ubuntu",
                          tag: "22.04",
                          label: "jammy"
                      },
                      {
                          name: "ubuntu",
                          tag: "24.04",
                          label: "noble"
                      },
                      {
                          name: "rockylinux",
                          tag: "8",
                          label: "rocky8"
                      },
                      {
                          name: "rockylinux",
                          tag: "9",
                          label: "rocky9"
                      }
                  ]
                  | if $selected_os == "all"
                    then .
                    else map(select(.label == $selected_os))
                    end'
          )
          if [[ $(jq 'length' <<< "$environments") -eq 0 ]]; then
              echo "Unknown operating system: ${selected_os}" >&2
              exit 1
          fi
          echo "environments=${environments}" >> "$GITHUB_OUTPUT"
  test:
    name: "Archivematica upgrade / ${{ matrix.environment.label }}"
    needs:
      - "select_matrix"
    runs-on: "ubuntu-24.04"
    env:
      python_version: "3.12"
    strategy:
      fail-fast: false
      matrix:
        environment: "${{ fromJSON(needs.select_matrix.outputs.environments) }}"
    steps:
      - name: "Check out the code"
        uses: "actions/checkout@v4"
      - name: "Set up the Podman test"
        uses: "./.github/actions/setup-podman-test"
        with:
          test-directory: "tests/archivematica-upgrade"
          python-version: "${{ env.python_version }}"
          cache-key-suffix: "archivematica-upgrade-${{ matrix.environment.label }}"
          constraints-file: "${{ matrix.environment.label == 'rocky8' && 'tests/common/constraints-rocky8.txt' || '' }}"
        env:
          DOCKER_IMAGE_NAME: "${{ matrix.environment.name }}"
          DOCKER_IMAGE_TAG: "${{ matrix.environment.tag }}"
      - name: "Install the stable version of Archivematica"
        working-directory: "${{ github.workspace }}/tests/archivematica-upgrade"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_PORT: 2222
        run: |
          ../common/prepare-ansible-roles \
              ../../playbooks/archivematica-noble/requirements.yml
          ansible-playbook -i localhost, playbook.yml \
              -u ubuntu \
              -e "am_version=1.18" \
              -e "archivematica_src_configure_am_site_url=http://archivematica" \
              -e "archivematica_src_configure_ss_url=http://archivematica:8000" \
              -v
      - name: "Get the Archivematica version"
        run: |
          curl \
              --fail-with-body \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              --retry-max-time 120 \
              --silent \
              --dump-header - \
              --header 'Authorization: ApiKey admin:this_is_the_am_api_key' \
              --header 'Content-Type: application/json' \
              'http://localhost:8000/api/processing-configuration/' | grep X-Archivematica-Version
      - name: "Check Archivematica APIs"
        run: |
          tests/common/check-archivematica-apis
      - name: "Upgrade to the QA version of Archivematica"
        working-directory: "${{ github.workspace }}/tests/archivematica-upgrade"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_PORT: 2222
        run: |
          rm -rf roles
          ../common/prepare-ansible-roles \
              ../../playbooks/archivematica-noble/requirements-qa.yml
          ansible-playbook -i localhost, playbook.yml \
              -u ubuntu \
              -e "am_version=qa" \
              -e "archivematica_src_configure_am_site_url=http://archivematica" \
              -e "archivematica_src_configure_ss_url=http://archivematica:8000" \
              -e "elasticsearch_version=8.19.2" \
              -t "elasticsearch,archivematica-src" \
              -v
      - name: "Get the Archivematica version"
        run: |
          curl \
              --fail-with-body \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              --retry-max-time 120 \
              --silent \
              --dump-header - \
              --header 'Authorization: ApiKey admin:this_is_the_am_api_key' \
              --header 'Content-Type: application/json' \
              'http://localhost:8000/api/processing-configuration/' | grep X-Archivematica-Version
      - name: "Check Archivematica APIs"
        run: |
          tests/common/check-archivematica-apis
      - name: "Save logs on failure"
        if: "${{ failure() || cancelled() }}"
        working-directory: "${{ github.workspace }}/tests/archivematica-upgrade"
        run: |
          ../common/collect-test-logs logs archivematica
      - name: "Upload logs on failure"
        if: "${{ failure() || cancelled() }}"
        uses: "actions/upload-artifact@v4"
        with:
          name: "logs-${{ matrix.environment.label }}"
          path: "${{ github.workspace }}/tests/archivematica-upgrade/logs"
