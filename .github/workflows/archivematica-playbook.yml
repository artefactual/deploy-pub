name: Archivematica Playbook Test
on:
  workflow_dispatch:
    inputs:
      database:
        description: "Database server to install"
        default: "percona"
        required: true
        type: "choice"
        options:
          - "percona"
          - "mariadb"
  pull_request:
    paths:
      - "playbooks/archivematica-noble/**"
  push:
    branches:
      - "master"
    paths:
      - "playbooks/archivematica-noble/**"
  schedule:
    - cron: "0 2 * * *"
jobs:
  test:
    name: "Test Archivematica playbook / ${{ inputs.database || 'percona' }}"
    runs-on: ubuntu-24.04
    env:
      database: "${{ inputs.database || 'percona' }}"
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: "Create Vagrant boxes directory"
      run: |
        mkdir -p /home/runner/.vagrant.d/boxes
    - name: "Cache Vagrant boxes"
      uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
      with:
        path: "/home/runner/.vagrant.d/boxes"
        key: "${{ runner.os }}-boxes"
    - name: Install Vagrant
      run: |
        wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt update && sudo apt install vagrant
    - name: Install VirtualBox
      run: |
        wget -O- https://www.virtualbox.org/download/oracle_vbox_2016.asc | sudo gpg --yes --output /usr/share/keyrings/oracle-virtualbox-2016.gpg --dearmor
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
        sudo apt update && sudo apt install virtualbox-7.1
    - name: Update vbox networks
      run: |
        sudo mkdir -p /etc/vbox/
        echo "* 192.168.168.198/24" | sudo tee -a /etc/vbox/networks.conf
    - name: Set the user environment as VirtualBox expects it
      run: |
        echo "USER=$USER" >> $GITHUB_ENV
        echo "LOGNAME=$USER" >> $GITHUB_ENV
    - name: Download the Ansible roles
      working-directory: ${{ github.workspace }}/playbooks/archivematica-noble
      run: |
        ansible-galaxy install -f -p roles/ -r requirements.yml
    - name: Create the virtual machine and provision it
      working-directory: ${{ github.workspace }}/playbooks/archivematica-noble
      env:
        DATABASE_SERVER: "${{ env.database }}"
      run: |
        vagrant up
    - name: Test AM API - Get processing configurations
      run: |
        test $( \
            curl \
                --silent \
                --header 'Authorization: ApiKey admin:this_is_the_am_api_key' \
                --header 'Content-Type: application/json' \
                'http://192.168.168.198/api/processing-configuration/' \
            | jq -r '.processing_configurations == ["automated", "default"]' \
        ) == true
    - name: Test SS API - Get pipeline count
      run: |
        test $( \
            curl \
                --silent \
                --header 'Authorization: ApiKey admin:this_is_the_ss_api_key' \
                --header 'Content-Type: application/json' \
                'http://192.168.168.198:8000/api/v2/pipeline/' \
            | jq -r '.meta.total_count == 1' \
        ) == true
    - name: Check the database server
      working-directory: ${{ github.workspace }}/playbooks/archivematica-noble
      env:
        DATABASE: "${{ env.database }}"
      run: |
        case $DATABASE in
            percona) client="mysql" ;;
            mariadb) client="mariadb" ;;
            *)
                echo "::error::Unknown database server: ${DATABASE}"
                exit 1
                ;;
        esac
        # A pseudo-terminal would merge the client warnings into the output.
        version=$(
            vagrant ssh -c \
                "sudo ${client} --batch --skip-column-names --execute 'SELECT VERSION()'" \
                -- -T
        )
        echo "Database server version: ${version}"
        case "${DATABASE}:${version}" in
            percona:8.0.*) ;;
            mariadb:11.8.*-MariaDB*) ;;
            *)
                echo "::error::Unexpected ${DATABASE} server version:" \
                    "${version}"
                exit 1
                ;;
        esac
