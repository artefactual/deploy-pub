name: "Archivematica Upgrade Test"
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system to test"
        default: "all"
        required: true
        type: "choice"
        options:
          - "all"
          - "jammy"
          - "noble"
          - "rocky8"
          - "rocky9"
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/archivematica-upgrade.yml"
      - ".github/actions/setup-libvirt-test/**"
      - "playbooks/archivematica-noble/**"
      - "tests/archivematica-upgrade/**"
      - "tests/common/**"
      - "!tests/archivematica-upgrade/README.md"
      - "!tests/common/README.md"
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/archivematica-upgrade.yml"
      - ".github/actions/setup-libvirt-test/**"
      - "playbooks/archivematica-noble/**"
      - "tests/archivematica-upgrade/**"
      - "tests/common/**"
      - "!tests/archivematica-upgrade/README.md"
      - "!tests/common/README.md"
jobs:
  select_matrix:
    name: "Select Archivematica upgrade matrix"
    runs-on: "ubuntu-24.04"
    outputs:
      environments: "${{ steps.select.outputs.environments }}"
    steps:
      - name: "Select matrix"
        id: "select"
        env:
          SELECTED_OS: "${{ inputs.os }}"
        run: |
          selected_os=${SELECTED_OS:-all}
          environments=$(
              jq --compact-output --null-input \
                  --arg selected_os "$selected_os" \
                  '["jammy", "noble", "rocky8", "rocky9"]
                  | if $selected_os == "all"
                    then .
                    else map(select(. == $selected_os))
                    end'
          )
          if [[ $(jq 'length' <<< "$environments") -eq 0 ]]; then
              echo "Unknown operating system: ${selected_os}" >&2
              exit 1
          fi
          echo "environments=${environments}" >> "$GITHUB_OUTPUT"
  test:
    name: "Archivematica upgrade / ${{ matrix.os }}"
    needs:
      - "select_matrix"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 60
    env:
      python_version: "3.12"
      ANSIBLE_HOST_KEY_CHECKING: "False"
      LIBVIRT_DEFAULT_URI: "qemu:///system"
      VM_OS: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: "${{ fromJSON(needs.select_matrix.outputs.environments) }}"
    steps:
      - name: "Check out the code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Check the virtualization prerequisites"
        run: |
          echo "::group::Processor"
          lscpu | grep --ignore-case --extended-regexp \
              'model name|hypervisor|virtual' || true
          grep --count --extended-regexp '^flags.*(vmx|svm)' /proc/cpuinfo \
              || true
          echo "::endgroup::"
          echo "::group::Memory and disk"
          free --human
          df --human-readable / /mnt || true
          echo "::endgroup::"
          if [[ ! -e /dev/kvm ]]; then
              echo "::error::/dev/kvm is missing, so QEMU would fall back to" \
                  "software emulation and the test would be far too slow"
              exit 1
          fi
          ls -l /dev/kvm
      - name: "Set up the libvirt test"
        uses: "./.github/actions/setup-libvirt-test"
        with:
          test-directory: "tests/archivematica-upgrade"
          os: "${{ matrix.os }}"
          python-version: "${{ env.python_version }}"
          cache-key-suffix: "archivematica-upgrade-${{ matrix.os }}"
          constraints-file: "${{ matrix.os == 'rocky8' && 'tests/common/constraints-rocky8.txt' || '' }}"
      - name: "Install the stable version of Archivematica"
        working-directory: "${{ github.workspace }}/tests/archivematica-upgrade"
        run: |
          ../common/prepare-ansible-roles --target vm \
              ../../playbooks/archivematica-noble/requirements.yml
          ansible-playbook -i "${VM_IP}," playbook.yml \
              -u ubuntu \
              -e "am_version=1.18" \
              -e "archivematica_src_configure_am_site_url=http://${VM_IP}" \
              -e "archivematica_src_configure_ss_url=http://${VM_IP}:8000" \
              -v
      - name: "Record the versions before the upgrade"
        run: |
          am_version=$(
              curl \
                  --fail-with-body \
                  --retry 12 \
                  --retry-all-errors \
                  --retry-delay 5 \
                  --retry-max-time 120 \
                  --silent \
                  --dump-header - \
                  --header 'Authorization: ApiKey admin:this_is_the_am_api_key' \
                  --header 'Content-Type: application/json' \
                  "http://${VM_IP}/api/processing-configuration/" \
                  | awk '/^X-Archivematica-Version/ { print $2 }' \
                  | tr --delete '\r'
          )
          mysql_version=$(tests/common/libvirt-vm ssh "mysql --version")
          echo "Archivematica ${am_version}"
          echo "${mysql_version}"
          if [[ -z $am_version ]]; then
              echo "::error::The Archivematica version header is missing"
              exit 1
          fi
          if [[ $mysql_version != *" Ver 8.0."* ]]; then
              echo "::error::Expected Percona Server 8.0 before the upgrade"
              exit 1
          fi
          echo "STABLE_AM_VERSION=${am_version}" >> "$GITHUB_ENV"
      - name: "Check Archivematica APIs"
        run: |
          AM_URL="http://${VM_IP}" \
          SS_URL="http://${VM_IP}:8000" \
              tests/common/check-archivematica-apis
      - name: "Upgrade to the QA version of Archivematica"
        working-directory: "${{ github.workspace }}/tests/archivematica-upgrade"
        run: |
          rm -rf roles
          ../common/prepare-ansible-roles --target vm \
              ../../playbooks/archivematica-noble/requirements-qa.yml
          ansible-playbook -i "${VM_IP}," playbook.yml \
              -u ubuntu \
              -e "am_version=qa" \
              -e "archivematica_src_configure_am_site_url=http://${VM_IP}" \
              -e "archivematica_src_configure_ss_url=http://${VM_IP}:8000" \
              -e "elasticsearch_version=8.19.2" \
              -t "elasticsearch,percona,archivematica-src" \
              -v
      - name: "Check the versions after the upgrade"
        run: |
          am_version=$(
              curl \
                  --fail-with-body \
                  --retry 12 \
                  --retry-all-errors \
                  --retry-delay 5 \
                  --retry-max-time 120 \
                  --silent \
                  --dump-header - \
                  --header 'Authorization: ApiKey admin:this_is_the_am_api_key' \
                  --header 'Content-Type: application/json' \
                  "http://${VM_IP}/api/processing-configuration/" \
                  | awk '/^X-Archivematica-Version/ { print $2 }' \
                  | tr --delete '\r'
          )
          mysql_version=$(tests/common/libvirt-vm ssh "mysql --version")
          echo "Archivematica ${am_version}"
          echo "${mysql_version}"
          if [[ -z $am_version ]]; then
              echo "::error::The Archivematica version header is missing"
              exit 1
          fi
          if [[ $am_version == "$STABLE_AM_VERSION" ]]; then
              echo "::error::Archivematica is still ${STABLE_AM_VERSION}"
              exit 1
          fi
          if [[ $mysql_version != *" Ver 8.4."* ]]; then
              echo "::error::Percona Server was not upgraded to 8.4"
              exit 1
          fi
      - name: "Check Archivematica APIs"
        run: |
          AM_URL="http://${VM_IP}" \
          SS_URL="http://${VM_IP}:8000" \
              tests/common/check-archivematica-apis
      - name: "Save logs on failure"
        if: "${{ failure() || cancelled() }}"
        working-directory: "${{ github.workspace }}/tests/archivematica-upgrade"
        run: |
          ../common/collect-vm-test-logs logs
      - name: "Upload logs on failure"
        if: "${{ failure() || cancelled() }}"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "logs-libvirt-${{ matrix.os }}"
          path: "${{ github.workspace }}/tests/archivematica-upgrade/logs"
      - name: "Destroy the virtual machine"
        if: "${{ always() }}"
        working-directory: "${{ github.workspace }}/tests/archivematica-upgrade"
        run: |
          ../common/libvirt-vm destroy
