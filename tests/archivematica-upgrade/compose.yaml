---
name: archivematica-upgrade-test

services:

  archivematica:
    build:
      context: ".."
      dockerfile: "common/Dockerfile"
      args:
        DOCKER_IMAGE_NAME: "${DOCKER_IMAGE_NAME:-ubuntu}"
        DOCKER_IMAGE_TAG: "${DOCKER_IMAGE_TAG:-22.04}"
        SSH_PUBLIC_KEY: "archivematica-upgrade/ssh_pub_key"
    ports:
      - "2222:22"
      - "8000:80"
      - "8001:8000"
