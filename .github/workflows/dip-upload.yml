name: "DIP Upload Test"
on:
  workflow_dispatch:
    inputs:
      am_version:
        description: "Archivematica ref (branch, tag or SHA to checkout)"
        default: "qa/1.x"
        required: true
        type: "string"
      ss_version:
        description: "Archivematica Storage Service ref (branch, tag or SHA to checkout)"
        default: "qa/0.x"
        required: true
        type: "string"
      atom_version:
        description: "AtoM ref (branch, tag or SHA to checkout)"
        default: "qa/2.x"
        required: true
        type: "string"
  pull_request:
    paths:
      - ".github/workflows/dip-upload.yml"
      - "tests/dip-upload/**"
      - "!tests/dip-upload/README.md"
  schedule:
    - cron: "0 2 * * *"
jobs:
  test:
    name: "DIP upload test"
    runs-on: "ubuntu-22.04"
    env:
      am_version: "${{ inputs.am_version || 'qa/1.x' }}"
      ss_version: "${{ inputs.ss_version || 'qa/0.x' }}"
      atom_version: "${{ inputs.atom_version || 'qa/2.x' }}"
      python_version: "3.13"
      atom_db_password: "aaGKHyMls.20ki$"
    steps:
      - name: "Check out the code"
        uses: "actions/checkout@v4"
      - name: "Upgrade crun (supports Ubuntu's systemd in the Dockerfile)"
        run: |
          wget https://github.com/containers/crun/releases/download/1.15/crun-1.15-linux-amd64
          sudo install crun-1.15-linux-amd64 /usr/bin/crun
          rm crun-1.15-linux-amd64
      - name: "Install Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ env.python_version }}"
          cache: "pip"
          cache-dependency-path: |
            tests/dip-upload/requirements.txt
      - name: "Install uv"
        run: |
          python -m pip install --upgrade uv
      - name: "Cache the virtual environment"
        id: "venv-cache"
        uses: "actions/cache@v4"
        with:
          path: |
            tests/dip-upload/.venv/
          key: "os-${{ runner.os }}-python_version-${{ env.python_version }}-hash-${{ hashFiles('tests/dip-upload/requirements.txt') }}"
      - name: "Set up the virtual environment"
        if: "steps.venv-cache.outputs.cache-hit == false"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          uv venv --python "${{ env.python_version }}" .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: "Add virtual environment to PATH"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run:
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - name: "Initialize workflow summary"
        run: |
          {
            echo "# DIP Upload Workflow Summary"
            echo
            echo "- Archivematica ref: \`${{ env.am_version }}\`"
            echo "- Storage Service ref: \`${{ env.ss_version }}\`"
            echo "- AtoM ref: \`${{ env.atom_version }}\`"
            echo "- Python: \`${{ env.python_version }}\`"
            echo "- Initial AtoM default culture for the install: \`en\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Generate an SSH key and copy it next to the Dockerfile"
        run: |
          mkdir -p $HOME/.ssh
          ssh-keygen -t rsa -f $HOME/.ssh/id_rsa -N ""
          cp $HOME/.ssh/id_rsa.pub ${{ github.workspace }}/tests/dip-upload/ssh_pub_key
      - name: "Start the Compose environment"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose up --detach
      - name: "Install Archivematica"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_PORT: 2222
        run: |
          ansible-galaxy install -f -p roles/ -r requirements.yml
          ansible-playbook -i localhost, archivematica.yml \
              -u ubuntu \
              -e "archivematica_src_am_version=${{ env.am_version }} archivematica_src_ss_version=${{ env.ss_version }}" \
              -v
      - name: "Add the ubuntu user to the archivematica group"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user root archivematica usermod -a -G archivematica ubuntu
      - name: "Get the archivematica SSH public key"
        id: archivematica_ssh_pub_key
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          echo "key=$(podman-compose exec --user archivematica archivematica cat /var/lib/archivematica/.ssh/id_rsa.pub)" >> $GITHUB_OUTPUT
      - name: "Install AtoM"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_PORT: 9222
        run: |
          ansible-playbook -i localhost, atom.yml \
              -u ubuntu \
              -e "atom_repository_version=${{ env.atom_version }} atom_default_culture=en archivematica_ssh_pub_key='${{ steps.archivematica_ssh_pub_key.outputs.key }}'" \
              -v
      - name: "Call an Archivematica API endpoint"
        run: |
          test $( \
              curl \
                  --silent \
                  --header 'Authorization: ApiKey admin:this_is_the_am_api_key' \
                  --header 'Content-Type: application/json' \
                  'http://localhost:8000/api/processing-configuration/' \
              | jq -r '.processing_configurations == ["automated", "default"]' \
          ) == true
      - name: "Call a Storage Service API endpoint"
        run: |
          test $( \
              curl \
                  --silent \
                  --header 'Authorization: ApiKey admin:this_is_the_ss_api_key' \
                  --header 'Content-Type: application/json' \
                  'http://localhost:8001/api/v2/pipeline/' \
              | jq -r '.meta.total_count == 1' \
          ) == true
      - name: "Call an AtoM API endpoint"
        run: |
          test $( \
            curl \
                --silent \
                --header 'REST-API-Key: this_is_the_atom_dip_upload_api_key' \
                --header 'Content-Type: application/json' \
                http://localhost:9000/index.php/api/informationobjects \
            | jq -r '.results == []' \
          ) == true
      - name: "Create a processing configuration for DIP upload"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user archivematica archivematica cp /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/automatedProcessingMCP.xml /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/dipuploadProcessingMCP.xml
      - name: "Update the DIP upload processing configuration"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          # Change 'Normalize for preservation' to 'Normalize for preservation and access'
          podman-compose exec --user archivematica archivematica sed --in-place 's|612e3609-ce9a-4df6-a9a3-63d634d2d934|b93cecd4-71f2-4e28-bc39-d32fd62c5a94|g' /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/dipuploadProcessingMCP.xml
          # Change 'Do not upload DIP' to 'Upload DIP to AtoM/Binder'
          podman-compose exec --user archivematica archivematica sed --in-place 's|6eb8ebe7-fab3-4e4c-b9d7-14de17625baa|0fe9842f-9519-4067-a691-8a363132ae24|g' /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/dipuploadProcessingMCP.xml
      - name: "Adjust SWORD deposit directory permission"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user root atom chmod +rx /home/archivematica/
      - name: "Create the first ISAD CSV with fr culture"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user root atom sh -lc "python3 - <<'PY'
          import csv
          from pathlib import Path

          source = Path('/usr/share/nginx/atom/lib/task/import/example/isad/example_information_objects_isad.csv')
          target = Path('/usr/share/nginx/atom/data/example_information_objects_isad_fr.csv')

          with source.open(newline='') as fh:
              rows = list(csv.DictReader(fh))

          fieldnames = list(rows[0].keys())

          for row in rows:
              row['culture'] = 'fr'

          with target.open('w', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)
          PY
          sed -n '1,3p' /usr/share/nginx/atom/data/example_information_objects_isad_fr.csv"
      - name: "Import the first AtoM sample data set"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony csv:import /usr/share/nginx/atom/data/example_information_objects_isad_fr.csv
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony propel:build-nested-set
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony cc
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony search:populate
      - name: "Start the first transfer and upload the DIP to example-item"
        id: "first-dip-package"
        run: |
          response=$(curl \
              --silent \
              --header "Authorization: ApiKey admin:this_is_the_am_api_key" \
              --request POST \
              --data "{ \
                  \"name\": \"dip-upload-test\", \
                  \"path\": \"$(echo -n '/home/ubuntu/archivematica-sampledata/SampleTransfers/DemoTransferCSV' | base64 -w 0)\", \
                  \"type\": \"standard\", \
                  \"processing_config\": \"dipupload\", \
                  \"access_system_id\": \"example-item\" \
              }" \
              http://localhost:8000/api/v2beta/package)
          printf '%s\n' "$response"
          echo "id=$(jq -r '.id' <<<"$response")" >> "$GITHUB_OUTPUT"
      - name: "Wait for the first DIP upload and pretty print the full verification response"
        run: |
          for attempt in $(seq 1 24); do
            response=$(curl \
                --silent \
                --header "REST-API-Key: this_is_the_atom_dip_upload_api_key" \
                http://localhost:9000/index.php/api/informationobjects/beihai-guanxi-china-1988 || true)

            if jq -e '.parent == "example-item" and (.digital_object.filename != null)' > /dev/null 2>&1 <<<"$response"; then
              printf '%s\n' "$response" | python3 -m json.tool
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for the first DIP upload to finish." >&2
          printf '%s\n' "$response" >&2
          exit 1
      - name: "Add the first culture report to the workflow summary"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          render_table() {
            title="$1"
            query="$2"
            mysql_pwd='${{ env.atom_db_password }}'
            rows=$(podman-compose exec atom sh -lc "MYSQL_PWD='$mysql_pwd' mysql -N -B -uatom-user -D atom -e \"$query\"")

            {
              echo "### $title"
              echo
              echo "| slug | source_culture | i18n_culture |"
              echo "| --- | --- | --- |"
            } >> "$GITHUB_STEP_SUMMARY"

            while IFS=$'\t' read -r slug source culture; do
              [ -n "$slug" ] || continue
              echo "| \`$slug\` | \`$source\` | \`$culture\` |" >> "$GITHUB_STEP_SUMMARY"
            done <<<"$rows"

            echo >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo
            echo "## First DIP upload"
            echo
            echo "- Package ID: \`${{ steps.first-dip-package.outputs.id }}\`"
            echo "- Imported CSV cultures were changed to \`fr\` before the first import."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          render_table \
            "Imported records" \
            "SELECT s.slug, io.source_culture, COALESCE(i18n.culture, '') FROM slug s JOIN information_object io ON io.id = s.object_id LEFT JOIN information_object_i18n i18n ON i18n.id = io.id AND i18n.culture = io.source_culture WHERE s.slug IN ('example-fonds', 'example-item') ORDER BY s.slug;"

          render_table \
            "DIP-created children under example-item" \
            "SELECT childslug.slug, io.source_culture, COALESCE(i18n.culture, '') FROM information_object io JOIN slug childslug ON childslug.object_id = io.id JOIN information_object parent ON parent.id = io.parent_id JOIN slug parentslug ON parentslug.object_id = parent.id LEFT JOIN information_object_i18n i18n ON i18n.id = io.id AND i18n.culture = io.source_culture WHERE parentslug.slug = 'example-item' ORDER BY childslug.slug;"
      - name: "Change the live AtoM default culture to es, restart services, and clear cache"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user root atom sh -lc "sed -i 's/^\([[:space:]]*default_culture:[[:space:]]*\).*/\1es/' /usr/share/nginx/atom/apps/qubit/config/settings.yml"
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom atom php -d memory_limit=-1 symfony cc
          podman-compose exec --user root atom systemctl restart php8.3-fpm nginx atom-worker

          for attempt in $(seq 1 12); do
            statuses=$(podman-compose exec atom sh -lc "systemctl is-active nginx php8.3-fpm atom-worker" || true)
            if [ "$statuses" = "$(printf 'active\nactive\nactive')" ]; then
              break
            fi
            sleep 5
          done

          podman-compose exec atom sh -lc "systemctl is-active nginx php8.3-fpm atom-worker && grep -n 'default_culture' /usr/share/nginx/atom/apps/qubit/config/settings.yml"

          for attempt in $(seq 1 12); do
            response=$(curl \
                --silent \
                --header "REST-API-Key: this_is_the_atom_dip_upload_api_key" \
                http://localhost:9000/index.php/api/informationobjects || true)

            if jq -e '.total >= 0' > /dev/null 2>&1 <<<"$response"; then
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for AtoM to recover after changing the default culture." >&2
          printf '%s\n' "$response" >&2
          exit 1
      - name: "Create the second ISAD CSV with *-2 slugs and fr culture"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user root atom sh -lc "python3 - <<'PY'
          import csv
          from pathlib import Path

          source = Path('/usr/share/nginx/atom/lib/task/import/example/isad/example_information_objects_isad.csv')
          target = Path('/usr/share/nginx/atom/data/example_information_objects_isad_fr_2.csv')

          with source.open(newline='') as fh:
              rows = list(csv.DictReader(fh))

          fieldnames = list(rows[0].keys())
          if 'slug' not in fieldnames:
              fieldnames.insert(fieldnames.index('culture'), 'slug')

          for row in rows:
              if row['legacyId'] == '1':
                  row['legacyId'] = '1001'
                  row['parentId'] = ''
                  row['slug'] = 'example-fonds-2'
              elif row['legacyId'] == '2':
                  row['legacyId'] = '1002'
                  row['parentId'] = '1001'
                  row['slug'] = 'example-item-2'

              row['culture'] = 'fr'

          with target.open('w', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)
          PY
          sed -n '1,3p' /usr/share/nginx/atom/data/example_information_objects_isad_fr_2.csv"
      - name: "Import the second AtoM sample data set"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony csv:import /usr/share/nginx/atom/data/example_information_objects_isad_fr_2.csv
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony propel:build-nested-set
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony cc
          podman-compose exec --user www-data --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony search:populate
      - name: "Start the second transfer and upload the DIP to example-item-2"
        id: "second-dip-package"
        run: |
          response=$(curl \
              --silent \
              --header "Authorization: ApiKey admin:this_is_the_am_api_key" \
              --request POST \
              --data "{ \
                  \"name\": \"dip-upload-test-2\", \
                  \"path\": \"$(echo -n '/home/ubuntu/archivematica-sampledata/SampleTransfers/DemoTransferCSV' | base64 -w 0)\", \
                  \"type\": \"standard\", \
                  \"processing_config\": \"dipupload\", \
                  \"access_system_id\": \"example-item-2\" \
              }" \
              http://localhost:8000/api/v2beta/package)
          printf '%s\n' "$response"
          echo "id=$(jq -r '.id' <<<"$response")" >> "$GITHUB_OUTPUT"
      - name: "Wait for the second DIP upload and pretty print the full verification response"
        run: |
          for attempt in $(seq 1 24); do
            response=$(curl \
                --silent \
                --header "REST-API-Key: this_is_the_atom_dip_upload_api_key" \
                http://localhost:9000/index.php/api/informationobjects/beihai-guanxi-china-1988-2 || true)

            if jq -e '.parent == "example-item-2" and (.digital_object.filename != null)' > /dev/null 2>&1 <<<"$response"; then
              printf '%s\n' "$response" | python3 -m json.tool
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for the second DIP upload to finish." >&2
          printf '%s\n' "$response" >&2
          exit 1
      - name: "Add the final culture report to the workflow summary"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          render_table() {
            title="$1"
            query="$2"
            mysql_pwd='${{ env.atom_db_password }}'
            rows=$(podman-compose exec atom sh -lc "MYSQL_PWD='$mysql_pwd' mysql -N -B -uatom-user -D atom -e \"$query\"")

            {
              echo "### $title"
              echo
              echo "| slug | source_culture | i18n_culture |"
              echo "| --- | --- | --- |"
            } >> "$GITHUB_STEP_SUMMARY"

            while IFS=$'\t' read -r slug source culture; do
              [ -n "$slug" ] || continue
              echo "| \`$slug\` | \`$source\` | \`$culture\` |" >> "$GITHUB_STEP_SUMMARY"
            done <<<"$rows"

            echo >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo
            echo "## Second DIP upload"
            echo
            echo "- Package ID: \`${{ steps.second-dip-package.outputs.id }}\`"
            echo "- AtoM default culture was changed to \`es\` before importing the \`*-2\` records."
            echo "- The \`*-2\` CSV records were still imported with explicit \`fr\` culture values."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          render_table \
            "Initial imported records" \
            "SELECT s.slug, io.source_culture, COALESCE(i18n.culture, '') FROM slug s JOIN information_object io ON io.id = s.object_id LEFT JOIN information_object_i18n i18n ON i18n.id = io.id AND i18n.culture = io.source_culture WHERE s.slug IN ('example-fonds', 'example-item') ORDER BY s.slug;"

          render_table \
            "Children under example-item" \
            "SELECT childslug.slug, io.source_culture, COALESCE(i18n.culture, '') FROM information_object io JOIN slug childslug ON childslug.object_id = io.id JOIN information_object parent ON parent.id = io.parent_id JOIN slug parentslug ON parentslug.object_id = parent.id LEFT JOIN information_object_i18n i18n ON i18n.id = io.id AND i18n.culture = io.source_culture WHERE parentslug.slug = 'example-item' ORDER BY childslug.slug;"

          render_table \
            "Second imported records" \
            "SELECT s.slug, io.source_culture, COALESCE(i18n.culture, '') FROM slug s JOIN information_object io ON io.id = s.object_id LEFT JOIN information_object_i18n i18n ON i18n.id = io.id AND i18n.culture = io.source_culture WHERE s.slug IN ('example-fonds-2', 'example-item-2') ORDER BY s.slug;"

          render_table \
            "Children under example-item-2" \
            "SELECT childslug.slug, io.source_culture, COALESCE(i18n.culture, '') FROM information_object io JOIN slug childslug ON childslug.object_id = io.id JOIN information_object parent ON parent.id = io.parent_id JOIN slug parentslug ON parentslug.object_id = parent.id LEFT JOIN information_object_i18n i18n ON i18n.id = io.id AND i18n.culture = io.source_culture WHERE parentslug.slug = 'example-item-2' ORDER BY childslug.slug;"
      - name: "Save logs on failure"
        if: "${{ failure() }}"
        run: |
          mkdir logs
          podman-compose exec --user root archivematica journalctl -u archivematica-mcp-client --no-pager > logs/mcp-client.log
          podman-compose exec --user root atom journalctl -u atom-worker --no-pager > logs/atom-worker.log
          podman cp dip-upload-test_atom_1:/usr/share/nginx/atom/log/qubit_worker.log logs/qubit_worker.log
          podman cp dip-upload-test_atom_1:/usr/share/nginx/atom/log/qubit_prod.log logs/qubit_prod.log
          podman cp dip-upload-test_atom_1:/usr/share/nginx/atom/log/qubit_cli.log logs/qubit_cli.log
        working-directory: "${{ github.workspace }}/tests/dip-upload"
      - name: "Upload logs on failure"
        if: "${{ failure() }}"
        uses: "actions/upload-artifact@v4"
        with:
          name: "logs"
          path: "${{ github.workspace }}/tests/dip-upload/logs"
