name: "DIP Upload Test"
on:
  workflow_dispatch:
    inputs:
      am_version:
        description: "Archivematica ref (branch, tag or SHA to checkout)"
        default: "qa/1.x"
        required: true
        type: "string"
      ss_version:
        description: "Archivematica Storage Service ref (branch, tag or SHA to checkout)"
        default: "qa/0.x"
        required: true
        type: "string"
      atom_version:
        description: "AtoM ref (branch, tag or SHA to checkout)"
        default: "qa/2.x"
        required: true
        type: "string"
      os:
        description: "Operating system to test"
        default: "all"
        required: true
        type: "choice"
        options:
          - "all"
          - "jammy"
          - "noble"
          - "rocky9"
  pull_request:
    paths:
      - ".github/workflows/dip-upload.yml"
      - ".github/actions/setup-podman-test/**"
      - "tests/dip-upload/**"
      - "tests/common/**"
      - "!tests/dip-upload/README.md"
      - "!tests/common/README.md"
  schedule:
    - cron: "0 2 * * *"
jobs:
  select_matrix:
    name: "Select DIP upload matrix"
    runs-on: "ubuntu-24.04"
    outputs:
      environments: "${{ steps.select.outputs.environments }}"
    steps:
      - name: "Select matrix"
        id: "select"
        env:
          SELECTED_OS: "${{ inputs.os }}"
        run: |
          selected_os=${SELECTED_OS:-all}
          environments=$(
              jq --compact-output --null-input \
                  --arg selected_os "$selected_os" \
                  '[
                      {
                          name: "ubuntu",
                          tag: "22.04",
                          label: "jammy",
                          web_user: "www-data"
                      },
                      {
                          name: "ubuntu",
                          tag: "24.04",
                          label: "noble",
                          web_user: "www-data"
                      },
                      {
                          name: "rockylinux",
                          tag: "9",
                          label: "rocky9",
                          web_user: "nginx"
                      }
                  ]
                  | if $selected_os == "all"
                    then .
                    else map(select(.label == $selected_os))
                    end'
          )
          if [[ $(jq 'length' <<< "$environments") -eq 0 ]]; then
              echo "Unknown operating system: ${selected_os}" >&2
              exit 1
          fi
          echo "environments=${environments}" >> "$GITHUB_OUTPUT"
  test:
    name: "DIP upload / ${{ matrix.environment.label }}"
    needs:
      - "select_matrix"
    runs-on: "ubuntu-24.04"
    env:
      am_version: "${{ inputs.am_version || 'qa/1.x' }}"
      ss_version: "${{ inputs.ss_version || 'qa/0.x' }}"
      atom_version: "${{ inputs.atom_version || 'qa/2.x' }}"
      python_version: "3.10"
    strategy:
      fail-fast: false
      matrix:
        environment: "${{ fromJSON(needs.select_matrix.outputs.environments) }}"
    steps:
      - name: "Check out the code"
        uses: "actions/checkout@v4"
      - name: "Set up the Podman test"
        uses: "./.github/actions/setup-podman-test"
        with:
          test-directory: "tests/dip-upload"
          python-version: "${{ env.python_version }}"
          cache-key-suffix: "dip-upload-${{ matrix.environment.label }}"
        env:
          ARCHIVEMATICA_DOCKER_IMAGE_NAME: "${{ matrix.environment.name }}"
          ARCHIVEMATICA_DOCKER_IMAGE_TAG: "${{ matrix.environment.tag }}"
          ATOM_DOCKER_IMAGE_NAME: "${{ matrix.environment.name }}"
          ATOM_DOCKER_IMAGE_TAG: "${{ matrix.environment.tag }}"
      - name: "Install Archivematica"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_PORT: 2222
        run: |
          ../common/prepare-ansible-roles requirements.yml
          ansible-playbook -i localhost, archivematica.yml \
              -u ubuntu \
              -e "archivematica_src_am_version=${{ env.am_version }} archivematica_src_ss_version=${{ env.ss_version }}" \
              -v
      - name: "Add the ubuntu user to the archivematica group"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user root archivematica usermod -a -G archivematica ubuntu
      - name: "Get the archivematica SSH public key"
        id: archivematica_ssh_pub_key
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          echo "key=$(podman-compose exec --user archivematica archivematica cat /var/lib/archivematica/.ssh/id_rsa.pub)" >> $GITHUB_OUTPUT
      - name: "Install AtoM"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_PORT: 9222
        run: |
          ansible-playbook -i localhost, atom.yml \
              -u ubuntu \
              -e "atom_repository_version=${{ env.atom_version }} archivematica_ssh_pub_key='${{ steps.archivematica_ssh_pub_key.outputs.key }}'" \
              -v
      - name: "Check Archivematica APIs"
        run: |
          tests/common/check-archivematica-apis
      - name: "Call an AtoM API endpoint"
        run: |
          test $( \
            curl \
                --silent \
                --header 'REST-API-Key: this_is_the_atom_dip_upload_api_key' \
                --header 'Content-Type: application/json' \
                http://localhost:9000/index.php/api/informationobjects \
            | jq -r '.results == []' \
          ) == true
      - name: "Create a processing configuration for DIP upload"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user archivematica archivematica cp /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/automatedProcessingMCP.xml /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/dipuploadProcessingMCP.xml
      - name: "Update the DIP upload processing configuration"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          # Change 'Normalize for preservation' to 'Normalize for preservation and access'
          podman-compose exec --user archivematica archivematica sed --in-place 's|612e3609-ce9a-4df6-a9a3-63d634d2d934|b93cecd4-71f2-4e28-bc39-d32fd62c5a94|g' /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/dipuploadProcessingMCP.xml
          # Change 'Do not upload DIP' to 'Upload DIP to AtoM/Binder'
          podman-compose exec --user archivematica archivematica sed --in-place 's|6eb8ebe7-fab3-4e4c-b9d7-14de17625baa|0fe9842f-9519-4067-a691-8a363132ae24|g' /var/archivematica/sharedDirectory/sharedMicroServiceTasksConfigs/processingMCPConfigs/dipuploadProcessingMCP.xml
      - name: "Adjust SWORD deposit directory permission"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user root atom chmod +rx /home/archivematica/
      - name: "Import the Atom sample data"
        working-directory: "${{ github.workspace }}/tests/dip-upload"
        run: |
          podman-compose exec --user ${{ matrix.environment.web_user }} --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony csv:import /usr/share/nginx/atom/lib/task/import/example/isad/example_information_objects_isad.csv
          podman-compose exec --user ${{ matrix.environment.web_user }} --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony propel:build-nested-set
          podman-compose exec --user ${{ matrix.environment.web_user }} --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony cc
          podman-compose exec --user ${{ matrix.environment.web_user }} --workdir /usr/share/nginx/atom/ atom php -d memory_limit=-1 symfony search:populate
      - name: "Start a transfer and upload the DIP to the sample archival description"
        id: "start_transfer"
        run: |
          response=$(
              curl \
                  --fail-with-body \
                  --silent \
                  --show-error \
                  --header "Authorization: ApiKey admin:this_is_the_am_api_key" \
                  --header "Content-Type: application/json" \
                  --request POST \
                  --data "{ \
                      \"name\": \"dip-upload-test\", \
                      \"path\": \"$(echo -n '/home/ubuntu/archivematica-sampledata/SampleTransfers/DemoTransferCSV' | base64 -w 0)\", \
                      \"type\": \"standard\", \
                      \"processing_config\": \"dipupload\", \
                      \"access_system_id\": \"example-item\" \
                  }" \
                  http://localhost:8000/api/v2beta/package
          )
          transfer_uuid=$(
              jq --exit-status --raw-output \
                  '.id | select(type == "string" and length > 0)' \
                  <<< "$response"
          )
          echo "transfer_uuid=${transfer_uuid}" >> "$GITHUB_OUTPUT"
      - name: "Wait for Archivematica processing to finish"
        env:
          TRANSFER_UUID: "${{ steps.start_transfer.outputs.transfer_uuid }}"
        run: |
          tests/common/wait-for-archivematica-transfer "$TRANSFER_UUID"
      - name: "Verify a digital object was uploaded and attached to the sample archival description"
        run: |
          tests/dip-upload/wait-for-atom-dip \
              beihai-guanxi-china-1988 example-item
      - name: "Save logs on failure"
        if: "${{ failure() || cancelled() }}"
        run: |
          ../common/collect-test-logs logs archivematica atom
        working-directory: "${{ github.workspace }}/tests/dip-upload"
      - name: "Upload logs on failure"
        if: "${{ failure() || cancelled() }}"
        uses: "actions/upload-artifact@v4"
        with:
          name: "logs-${{ matrix.environment.label }}"
          path: "${{ github.workspace }}/tests/dip-upload/logs"
